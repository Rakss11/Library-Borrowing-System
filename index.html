<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📚 Smart Library</h1>
    <p>Library Borrowing Management System</p>
</header>

<div class="layout">

<aside>
    <h2>Menu</h2>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('books')">Book Collection</button>
    <button onclick="showPage('add')">Add Book</button>
    <button onclick="showPage('borrow')">Borrow Book</button>
    <button onclick="showPage('return')">Return Book</button>
    <button onclick="showPage('overdue')">Overdue Books</button>
    <button onclick="showPage('history')">Return History</button>
</aside>

<main>

<section id="dashboard" class="page">
    <h2>Dashboard</h2>
    <div class="dashboard">
        <div class="card">Total Books<h3 id="total">0</h3></div>
        <div class="card">Available Books<h3 id="available">0</h3></div>
        <div class="card">Borrowed Books<h3 id="borrowed">0</h3></div>
        <div class="card">Overdue Books<h3 id="late">0</h3></div>
    </div>
</section>

<section id="books" class="page">
    <h2>Book Collection</h2>
    <input id="search" placeholder="Search book name...">
    <div id="bookList"></div>
</section>

<section id="add" class="page">
    <h2>Add New Book</h2>
    <input id="bookId" placeholder="Book ID">
    <input id="bookName" placeholder="Book Name">
    <input id="author" placeholder="Author Name">
    <button onclick="addBook()">Add Book</button>
</section>

<section id="borrow" class="page">
    <h2>Borrow Book</h2>
    <input id="student" placeholder="Student Name">
    <input id="studentId" placeholder="Student ID">
    <select id="borrowBook"></select>
    <button onclick="borrowBook()">Borrow Now</button>
</section>

<section id="return" class="page">
    <h2>Return Book</h2>
    <select id="returnBook"></select>
    <button onclick="returnBook()">Return Now</button>
</section>

<section id="overdue" class="page">
    <h2>Overdue Books</h2>
    <div id="overdueList"></div>
</section>

<section id="history" class="page">
    <h2>Recently Returned Books</h2>
    <div id="historyList"></div>
</section>

</main>
</div>

<script src="script.js"></script>
</body>
</html>
